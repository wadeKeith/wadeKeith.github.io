<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大模型学习之路</title>
    <script>
      if (location.protocol === "https:" && /^(www\.)?yincheng429\.cn$/.test(location.hostname)) {
        location.replace(`http://${location.host}${location.pathname}${location.search}${location.hash}`);
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260617deep" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-main">
        <p class="kicker">大模型学习之路</p>
        <h1>像读教材一样学大模型</h1>
        <p>先读完整讲义，再用 DeepSeek 导师答疑；目录、问答和笔记都只在需要时出现。</p>
      </div>
      <div class="header-actions">
        <button id="openCatalog" class="ghost-button" type="button" aria-controls="catalogDrawer" aria-expanded="false">目录</button>
        <button id="openMentor" type="button" aria-controls="mentorDrawer" aria-expanded="false">问导师</button>
      </div>
    </header>

    <div class="status-bar" aria-label="系统状态">
      <span id="dbStatus">知识库：加载中</span>
      <span id="modelStatus">模型：连接中</span>
      <span id="retrievalStatus">检索：检查中</span>
      <span id="progressStatus">进度：0/16</span>
    </div>

    <main class="reader-shell">
      <section class="chapter-hero" aria-labelledby="chapterTitle">
        <div>
          <p id="stageLabel" class="kicker">Stage 00</p>
          <h2 id="chapterTitle">正在加载课程</h2>
          <p id="chapterSummary">正在读取本地课程路径和知识库状态。</p>
        </div>
        <div class="chapter-actions">
          <button id="prevModule" class="ghost-button" type="button">上一章</button>
          <button id="nextModule" class="ghost-button" type="button">下一章</button>
          <button id="markDone" type="button">标记完成</button>
        </div>
      </section>

      <nav class="reader-tabs" aria-label="学习视图">
        <button class="active" type="button" data-tab="lesson">讲义</button>
        <button type="button" data-tab="map">概念图</button>
        <button type="button" data-tab="practice">练习</button>
        <button type="button" data-tab="notes">笔记</button>
      </nav>

      <section id="lessonView" class="reader-view active" aria-live="polite"></section>
      <section id="mapView" class="reader-view" aria-live="polite"></section>
      <section id="practiceView" class="reader-view" aria-live="polite"></section>
      <section id="notesView" class="reader-view" aria-live="polite"></section>
    </main>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

    <aside id="catalogDrawer" class="drawer catalog-drawer" aria-label="课程目录" aria-hidden="true" inert>
      <div class="drawer-head">
        <div>
          <p class="kicker">16 阶段路径</p>
          <h2>课程目录</h2>
        </div>
        <button id="closeCatalog" class="ghost-button" type="button">关闭</button>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      <div id="moduleList" class="module-list"></div>
      <button id="resetProgress" class="text-button" type="button">重置完成状态</button>
    </aside>

    <aside id="mentorDrawer" class="drawer mentor-drawer" aria-label="DeepSeek 导师" aria-hidden="true" inert>
      <div class="drawer-head">
        <div>
          <p class="kicker">DeepSeek 导师</p>
          <h2>读不懂就问</h2>
        </div>
        <button id="closeMentor" class="ghost-button" type="button">关闭</button>
      </div>
      <div id="quickPrompts" class="prompt-list"></div>
      <textarea id="questionInput" rows="7" placeholder="把没读懂的概念、推导、实验任务或你的笔记贴在这里。"></textarea>
      <div class="mentor-actions">
        <button id="askBtn" type="button">提交问题</button>
        <button id="clearAnswer" class="ghost-button" type="button">清空</button>
      </div>
      <div id="answerBox" class="answer-box">导师回答会显示在这里。系统会在后台检索课程资料，但不会把召回列表展示给读者。</div>
    </aside>

    <script src="./lecture_details.js?v=20260617deep"></script>
    <script src="./app.js?v=20260617deep"></script>
  </body>
</html>
